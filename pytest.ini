[pytest]
# SAA-82: Pytest configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Output
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Timeout (fail fast, don't hang)
timeout = 30

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (may need database)
    slow: Slow tests (skip with -m "not slow")

# Coverage (when running with --cov)
# Run with: pytest --cov=. --cov-report=term-missing
